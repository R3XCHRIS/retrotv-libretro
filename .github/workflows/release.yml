name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-compiler (zig)
        run: pip install ziglang==0.13.0
      - name: FFmpeg 7.1 headers
        run: make deps
      - name: Unit tests (ASan/UBSan)
        run: make test
      - name: Strict host compile
        run: make check
      - name: Cross-build for Raspberry Pi 5 (aarch64)
        run: make && file build/retrotv_libretro.so
      - name: Release files
        run: |
          mkdir -p dist
          cp build/retrotv_libretro.so replayos/retrotv_install.sh replayos/retrotv_uninstall.sh replayos/retrotv_update.sh replayos/retrotv_launch.sh replayos/retrotv-zaparoo.toml dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "RetroTV $GITHUB_REF_NAME" --generate-notes
